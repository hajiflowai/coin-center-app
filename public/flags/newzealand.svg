<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="100%" height="100%">
  <!-- Blue Field -->
  <rect width="1200" height="600" fill="#00247d"/>
  <!-- Union Jack Canton -->
  <g id="canton">
    <rect width="600" height="300" fill="#00247d"/>
    <path d="M0,0 L600,300 M600,0 L0,300" stroke="#ffffff" stroke-width="60"/>
    <path d="M0,0 L600,300 M600,0 L0,300" stroke="#cf142b" stroke-width="40"/>
    <path d="M300,0 V300 M0,150 H600" stroke="#ffffff" stroke-width="100"/>
    <path d="M300,0 V300 M0,150 H600" stroke="#cf142b" stroke-width="60"/>
  </g>
  <!-- Southern Cross Stars (Red with White outline) -->
  <!-- Gamma Crucis (top) -->
  <g transform="translate(900,120)">
    <polygon points="0,-45 13,-13 45,0 13,13 0,45 -13,13 -45,0 -13,-13" fill="#ffffff"/>
    <polygon points="0,-33 9,-9 33,0 9,9 0,33 -9,9 -33,0 -9,-9" fill="#cf142b"/>
  </g>
  <!-- Delta Crucis (right) -->
  <g transform="translate(1040,240)">
    <polygon points="0,-40 11,-11 40,0 11,11 0,40 -11,11 -40,0 -11,-11" fill="#ffffff"/>
    <polygon points="0,-28 8,-8 28,0 8,8 0,28 -8,8 -28,0 -8,-8" fill="#cf142b"/>
  </g>
  <!-- Beta Crucis (left) -->
  <g transform="translate(760,270)">
    <polygon points="0,-45 13,-13 45,0 13,13 0,45 -13,13 -45,0 -13,-13" fill="#ffffff"/>
    <polygon points="0,-33 9,-9 33,0 9,9 0,33 -9,9 -33,0 -9,-9" fill="#cf142b"/>
  </g>
  <!-- Alpha Crucis (bottom) -->
  <g transform="translate(900,450)">
    <polygon points="0,-50 14,-14 50,0 14,14 0,50 -14,14 -50,0 -14,-14" fill="#ffffff"/>
    <polygon points="0,-37 10,-10 37,0 10,10 0,37 -10,10 -37,0 -10,-10" fill="#cf142b"/>
  </g>
</svg>
