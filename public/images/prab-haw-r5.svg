      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#334155"/>
    </radialGradient>
  </defs>
  <rect width="400" height="400" fill="#090d16"/>
  <!-- Top Loop -->
  <circle cx="200" cy="45" r="16" fill="none" stroke="#cbd5e1" stroke-width="6"/>
  <!-- Main Coin -->
  <circle cx="200" cy="210" r="150" fill="url(#silverPatina)" stroke="#f1f5f9" stroke-width="5"/>
  <circle cx="200" cy="210" r="135" fill="none" stroke="#1e293b" stroke-width="2"/>
  <text x="200" y="125" font-family="'Inter', sans-serif" font-size="16" font-weight="900" fill="#0f172a" text-anchor="middle">จุฬาลงกรณ์ ป.ร. พระจุลมงกุฎ</text>
  <text x="200" y="215" font-family="'Inter', sans-serif" font-size="34" font-weight="900" fill="#fff" text-anchor="middle">เหรียญปราบฮ่อ</text>
  <text x="200" y="265" font-family="'Inter', sans-serif" font-size="20" font-weight="800" fill="#0f172a" text-anchor="middle">๑๒๓๙ ๑๒๔๐ ๑๒๔๗</text>
  <text x="200" y="315" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#334155" text-anchor="middle">พ.ศ. ๒๔๒๗ (รัชกาลที่ ๕)</text>
