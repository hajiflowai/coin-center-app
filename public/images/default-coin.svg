  <circle cx="200" cy="200" r="130" fill="none" stroke="#713f12" stroke-width="3" stroke-dasharray="8 6"/>
  <text x="200" y="215" font-family="sans-serif" font-size="70" font-weight="bold" fill="#451a03" text-anchor="middle">🪙</text>
